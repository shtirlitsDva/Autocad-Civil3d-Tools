<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTOAMKB kort</title>
<style>
/* Layout: sidebar with actions, filters and the list of findings; map canvas to the right with the B panel, the info
   card and the marks stacked on the right edge. One dark look, like model space in AutoCAD */
:root {
  --bg: #15191c; --panel: #1d2226; --panel-2: #252b30; --fg: #e4e8ea; --muted: #96a0a6; --line: #343b40;
  --accent: #6fb3ff; --sel: #ffffff; --warn: #ffb000; --ok: #5cbf86; --bad: #ef6a61;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
#app { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100%; }
@media (max-width: 760px) { #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 46% 54%; } }
#side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#side header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .01em; }
#meta { color: var(--muted); font-size: 12.5px; font-family: var(--mono); margin-top: 2px; }
.actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
#saveState { font-size: 12.5px; color: var(--muted); }
#saveState.dirty { color: var(--warn); }
#status { font-size: 12.5px; margin-top: 6px; overflow-wrap: anywhere; }
#status.bad { color: var(--bad); }
.notice { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--warn); border-radius: 4px; background: rgba(255,176,0,.08); font-size: 13px; display: grid; gap: 6px; }
.notice .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.sec { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.sec h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.sec h2 button { font: inherit; text-transform: none; letter-spacing: 0; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; cursor: pointer; margin-left: 4px; }
.row { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; user-select: none; }
.row input { margin: 0; accent-color: var(--accent); }
.sw { width: 12px; height: 12px; border-radius: 2px; flex: none; border: 1px solid rgba(255,255,255,.25); }
.cnt { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; }
#layers { max-height: 30vh; overflow: auto; }
.grp > .row { font-weight: 600; }
.grp .kids { padding-left: 20px; display: none; }
.grp.open .kids { display: block; }
.caret { width: 14px; color: var(--muted); flex: none; text-align: center; }
.kids .row { font-size: 13px; }
.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#list { overflow: auto; flex: 1; min-height: 0; margin: 0 -16px; }
.item { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; padding: 6px 16px; cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--panel-2); }
.item.sel { background: var(--panel-2); border-left-color: var(--sel); }
.item .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
.item .id { font-family: var(--mono); font-weight: 600; }
.item .k { color: var(--muted); font-size: 12.5px; }
.item .d { font-size: 12.5px; overflow-wrap: anywhere; }
.item.non { opacity: .55; }
.tag { font: 600 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-left: 4px; }
.tag.check { color: var(--warn); border-color: var(--warn); }
#mapWrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #0f1214; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#map.drag { cursor: grabbing; }
#tools { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; }
#tools button { font: 600 14px var(--font); background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; min-width: 34px; height: 32px; padding: 0 10px; cursor: pointer; }
#tools button:hover, .sec h2 button:hover { border-color: var(--accent); }
#tools button.on { background: var(--accent); color: #0f1214; border-color: var(--accent); }
#mread { position: absolute; top: 52px; left: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font: 13px var(--mono); }
#legend { display: grid; gap: 0; font-size: 12.5px; color: var(--muted); padding: 4px 0 2px 22px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#right { position: absolute; top: 12px; right: 12px; bottom: 40px; width: min(372px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 10px; pointer-events: none; overflow-y: auto; }
#right > * { pointer-events: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.45); flex: none; }
#info { overflow: auto; max-height: 42vh; }
#nonPanel { display: flex; flex-direction: column; min-height: 140px; flex: 1 1 auto; gap: 6px; }
.nhead { display: flex; align-items: center; gap: 8px; }
.sbtn { font: 600 12.5px var(--font); background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; cursor: pointer; }
.sbtn:hover { border-color: var(--accent); }
.sbtn.primary { background: var(--accent); color: #0f1214; border-color: var(--accent); }
.sbtn:disabled { opacity: .5; cursor: default; }
.lnk { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }
#nList { overflow: auto; min-height: 0; margin: 0 -14px; }
.nrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 5px 14px; cursor: pointer; }
.nrow:hover { background: var(--panel-2); }
.nrow .id { font-family: var(--mono); font-weight: 600; }
.nrow .k, .nrow .note { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.nrow .note { color: var(--fg); }
.nrow .warn { font-size: 12.5px; color: var(--warn); }
.nrow button { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; align-self: start; }
.mark { display: grid; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.mark input { font: 13px var(--font); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; }
.mark .state { font-size: 12.5px; color: var(--muted); }
.mark .state.check { color: var(--warn); }
#info .top { display: flex; align-items: baseline; gap: 10px; }
#info .id { font: 700 18px var(--mono); }
#info .x { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
#info .kind { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; margin: 4px 0 8px; }
#info dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 13px; }
#info dt { color: var(--muted); }
#info dd { margin: 0; overflow-wrap: anywhere; }
/* Montagehul B: a window in the bottom-right corner, resized from its top-left corner */
#bPanel { position: absolute; right: 12px; bottom: 12px; width: 380px; min-width: 300px; min-height: 120px; max-width: calc(100% - 24px); max-height: calc(100% - 24px); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
#bGrip { position: absolute; left: 0; top: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; z-index: 1; }
#bGrip::before { content: ''; position: absolute; left: 4px; top: 4px; width: 8px; height: 8px; border-left: 2px solid var(--muted); border-top: 2px solid var(--muted); }
#bGrip:hover::before { border-color: var(--accent); }
.bbody { padding: 12px 14px 12px 18px; overflow: auto; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.bhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.bline { display: grid; grid-template-columns: 74px minmax(0, 1fr) 64px; align-items: center; gap: 8px; font-size: 13px; }
.bline output { font: 600 13px var(--mono); color: var(--accent); text-align: right; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.bnote { font-size: 12.5px; color: var(--muted); margin: 2px 0 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
.chip { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 10px; padding: 1px 2px 1px 8px; display: inline-flex; gap: 2px; align-items: center; cursor: pointer; }
.chip button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; }
#bAl { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; display: grid; gap: 4px; }
#bSec { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-height: 0; }
.shead { display: flex; align-items: center; gap: 8px; font: 13px var(--mono); }
.shead #sLabel { flex: 1; text-align: center; }
.shead button { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; padding: 0 8px; font-size: 12px; }
/* Below 220 px the true-scale drawing would be too small to read; the window scrolls instead */
#sSvg { width: 100%; flex: 1 1 240px; min-height: 220px; display: block; background: #12171a; border-radius: 4px; }
#sVerdict { font: 600 13px var(--mono); }
#sVerdict.ok { color: var(--ok); }
#sVerdict.bad { color: var(--bad); }
#sNote { font-size: 12.5px; color: var(--muted); }
.xs-soil { fill: #4a3c28; } .xs-walk { fill: #2c3236; } .xs-asph { fill: #59606a; }
.xs-trench { fill: #9c8656; stroke: #6f5c3e; stroke-width: 1; }
.xs-kerb { stroke: #e4e8ea; stroke-width: 3; } .xs-ext { stroke: #96a0a6; stroke-width: 1; stroke-dasharray: 3 3; }
.xs-hbg { fill: #46211e; } .xs-hl { stroke: #ef6a61; stroke-width: 2; }
.xs-board { fill: #f1f1f1; stroke: #ef6a61; stroke-width: 1; } .xs-stripe { fill: #ef6a61; }
.xs-dim { stroke: #96a0a6; stroke-width: 1; fill: none; }
.xs-t { fill: #e4e8ea; font: 11px var(--mono); } .xs-ts { fill: #96a0a6; font: 10.5px var(--font); } .xs-vk { fill: #e4e8ea; font: 700 10.5px var(--font); }
.xs-ok { stroke: #5cbf86; stroke-width: 3; fill: none; } .xs-bad { stroke: #ef6a61; stroke-width: 3; fill: none; }
.xs-tok { fill: #5cbf86; font: 600 11.5px var(--mono); } .xs-tbad { fill: #ef6a61; font: 600 11.5px var(--mono); }
.xs-need { stroke: #e4e8ea; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; } .xs-short { stroke: #ef6a61; stroke-width: 4; }
#scale { position: absolute; left: 12px; bottom: 12px; font: 12px var(--mono); color: var(--muted); }
#scale i { display: block; height: 6px; border: 1px solid var(--muted); border-top: 0; margin-top: 2px; }
#hint { position: absolute; left: 120px; bottom: 12px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>AUTOAMKB kort</h1>
      <div id="meta"></div>
      <div class="actions">
        <button class="sbtn primary" id="save" type="button" title="Gem montagehul B og markeringer i denne kort-fil">Gem</button>
        <button class="sbtn" id="export" type="button" title="Gem, og skriv den endelige Excel-fil til logbog og journal">Eksportér Excel</button>
        <span id="saveState" aria-live="polite"></span>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="notices"></div>
    </header>
    <div class="sec">
      <h2>Risici <span><button id="kOn" type="button">Alle</button><button id="kOff" type="button">Ingen</button></span></h2>
      <div id="kinds"></div>
    </div>
    <div class="sec">
      <h2>Tegning <span><button id="lOn" type="button">Alle</button><button id="lOff" type="button">Ingen</button></span></h2>
      <div id="layers"></div>
      <div id="legend">
        <label class="row"><input type="checkbox" id="pv_trench" checked><i class="sw" style="background:rgba(234,217,168,.8)"></i>Rende (W)</label>
        <label class="row"><input type="checkbox" id="pv_hole" checked><i class="sw" style="background:rgba(255,140,0,.75)"></i>Montagehul B</label>
        <label class="row"><input type="checkbox" id="pv_ok" checked><i class="sw" style="background:rgba(60,200,120,.6)"></i>3 m bilpassage, plads</label>
        <label class="row"><input type="checkbox" id="pv_miss" checked><i class="sw" style="background:rgba(255,50,50,.7)"></i>3 m bilpassage, mangler</label>
      </div>
    </div>
    <div class="sec grow">
      <h2>Fund <span id="count"></span></h2>
      <div id="list"></div>
    </div>
  </aside>
  <main id="mapWrap">
    <canvas id="map" aria-label="Kort over tracéet med risici"></canvas>
    <div id="tools">
      <button id="zin" type="button" title="Zoom ind">+</button>
      <button id="zout" type="button" title="Zoom ud">−</button>
      <button id="zall" type="button">Hele tracéet</button>
      <button id="measure" type="button" title="Klik punkter, dobbeltklik for at afslutte, Esc for at rydde">Mål</button>
    </div>
    <div id="mread" hidden></div>
    <div id="right">
      <div id="info" class="card" hidden></div>
      <div id="nonPanel" class="card">
        <div class="nhead"><b>Ikke-problemer</b><span class="cnt" id="nCount"></span></div>
        <label class="row"><input type="checkbox" id="nHide"> Skjul dem på kortet og i listen</label>
        <div id="nList"></div>
      </div>
    </div>
    <div id="bPanel" class="card">
      <div id="bGrip" title="Træk for at ændre størrelsen" aria-hidden="true"></div>
      <div class="bbody">
        <div class="bhead"><b>Montagehul B</b><span class="cnt" id="bCount"></span></div>
        <div class="bline"><span>Global</span><input type="range" id="bGlobal" min="0" max="1.5" step="0.01" aria-label="Montagehul B, global"><output id="bGlobalOut" for="bGlobal"></output></div>
        <div class="bnote" id="bStd"></div>
        <div class="chips" id="bChips"></div>
        <div id="bAl" hidden>
          <label class="row"><input type="checkbox" id="bOnly"> Kun alignment <b id="bAlName"></b></label>
          <div class="bline" id="bAlLine"><span id="bAlLabel"></span><input type="range" id="bAlRange" min="0" max="1.5" step="0.01" aria-label="Montagehul B for valgt alignment"><output id="bAlOut" for="bAlRange"></output></div>
        </div>
        <div id="bSec" hidden>
          <div class="shead"><button id="sPrev" type="button" title="0,5 m tilbage">◀</button><span id="sLabel"></span><button id="sNext" type="button" title="0,5 m frem">▶</button><button id="sClose" type="button" title="Luk tværsnittet" aria-label="Luk tværsnittet">×</button></div>
          <svg id="sSvg" role="img" aria-label="Tværsnit ved valgt station"></svg>
          <div id="sVerdict"></div>
          <div id="sNote"></div>
        </div>
        <div class="bnote" id="bHint">Klik ved tracéet for at se tværsnittet dér.</div>
      </div>
    </div>
    <div id="scale"></div>
    <div id="hint">Træk for at panorere · hjul for zoom · klik ved tracéet for tværsnit, på et fund eller en LER-ledning</div>
  </main>
</div>
<script type="application/json" id="data">__DATA__</script>
<script type="application/json" id="passage">__PASSAGE__</script>
<script type="application/json" id="state">__STATE__</script>
<script>
(function () {
  // The page as loaded, before anything here changes it: a browser without file access saves a copy of this.
  var PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;
  var D = JSON.parse(document.getElementById('data').textContent);
  var P = JSON.parse(document.getElementById('passage').textContent);
  var SAVED = JSON.parse(document.getElementById('state').textContent) || {};

  var KIND_COLOR = { EL_KRYDS: '#ffb000', EL_LANGS: '#ffd36b', GAS_KRYDS: '#ff4fa3', GAS_LANGS: '#ff9ccb', VAND_KRYDS: '#2fa8ff', VAND_LANGS: '#8fd0ff', DYBDE: '#b07cff', SMALVEJ: '#ff5a36', JORD: '#8bd450', VENTIL: '#00e0c0' };
  var KIND_ORDER = D.excel.kinds.map(function (k) { return k.key; }).concat(['VENTIL']);
  var KIND_TEXT = {};
  D.excel.kinds.forEach(function (k) { KIND_TEXT[k.key] = k; });
  var STEP = P.sampleStep, NEED = P.need, JOIN = P.joinGap, MINLEN = P.minLength, STD_B = P.B;
  var FONT = getComputedStyle(document.body).fontFamily;

  // ---- formatting, as AUTOAMKB writes it ----
  function pad3(st) { var n = Math.floor(st + 1e-6), s = String(Math.abs(n)); while (s.length < 3) { s = '0' + s; } return (n < 0 ? '-' : '') + s; }
  function fmt(v, d) { return v.toFixed(d).replace('.', ','); }
  function m(v) { return fmt(v, 2) + ' m'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function nowText() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function upper(s) { return String(s).toUpperCase(); }
  function byName(a, b) { a = upper(a); b = upper(b); return a < b ? -1 : a > b ? 1 : 0; }
  function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  // ---- alignments: the line with its stations, for placing stretches ----
  var AL = {};
  D.alignments.forEach(function (a) { AL[a.name] = a; });
  function pointAt(al, st) {
    var a = AL[al];
    if (!a || !a.st.length) { return null; }
    var s = a.st, p = a.pts, n = s.length;
    if (st <= s[0]) { return [p[0], p[1]]; }
    if (st >= s[n - 1]) { return [p[2 * n - 2], p[2 * n - 1]]; }
    var lo = 1, hi = n - 1;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (s[mid] < st) { lo = mid + 1; } else { hi = mid; } }
    var t = (st - s[lo - 1]) / (s[lo] - s[lo - 1]);
    return [p[2 * lo - 2] + (p[2 * lo] - p[2 * lo - 2]) * t, p[2 * lo - 1] + (p[2 * lo + 1] - p[2 * lo - 1]) * t];
  }
  function between(al, from, to) {
    var a = AL[al], out = [], p0 = pointAt(al, from), p1 = pointAt(al, to);
    if (!p0) { return out; }
    out.push(p0[0], p0[1]);
    for (var i = 0; i < a.st.length; i++) { if (a.st[i] > from && a.st[i] < to) { out.push(a.pts[2 * i], a.pts[2 * i + 1]); } }
    out.push(p1[0], p1[1]);
    return out;
  }
  function rightAt(al, st) {
    var p0 = pointAt(al, st - 0.05), p1 = pointAt(al, st + 0.05);
    if (!p0 || !p1) { return [0, 0]; }
    var tx = p1[0] - p0[0], ty = p1[1] - p0[1], l = Math.hypot(tx, ty) || 1;
    return [ty / l, -tx / l];
  }

  // ---- the narrow-road measurement at every check sample: gaps in metres, -1 no road edge, -2 trench width unknown.
  // They come as AUTOAMKB's exact doubles, so a sample right at the limit is judged the same way here ----
  function exactDoubles(b64) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
    return new Float64Array(bytes.buffer);
  }
  var PA = {};
  P.alignments.forEach(function (a) { a.g = exactDoubles(a.g); PA[a.name] = a; });
  function sampleStation(a, i) { return i < a.n - 1 ? a.s0 + i * STEP : a.last; }
  function sampleIndex(a, st) { return Math.max(0, Math.min(a.n - 1, Math.round((st - a.s0) / STEP))); }
  function widthAt(a, i) {
    var w = a.w, lo = 0, hi = w.length / 2 - 1, best = -1;
    while (lo <= hi) { var mid = (lo + hi) >> 1; if (w[2 * mid] <= i) { best = mid; lo = mid + 1; } else { hi = mid - 1; } }
    return best < 0 ? 0 : w[2 * best + 1];
  }

  // ---- setup: Montagehul B (global and per alignment) and the not-a-problem marks; saved into this file ----
  var setup = { globalB: null, overrides: {}, marks: {} };
  var savedAt = SAVED.savedAt || '';
  function loadSetup(s) {
    setup = { globalB: typeof s.globalB === 'number' ? s.globalB : null, overrides: s.overrides || {}, marks: s.marks || {} };
  }
  loadSetup(SAVED);
  var standardB = typeof SAVED.standardB === 'number' ? SAVED.standardB : STD_B;
  var pendingStandard = Math.abs(standardB - STD_B) > 1e-9;
  function globalB() { return setup.globalB !== null ? setup.globalB : pendingStandard ? standardB : STD_B; }
  function bFor(al) { return own(setup.overrides, al) ? setup.overrides[al] : globalB(); }

  var savedJson = setupJson();

      sh.widths.forEach(function (w) { out.push('<col min="' + w[0] + '" max="' + w[0] + '" width="' + w[1] + '" customWidth="1"/>'); });
      out.push('</cols>');
    }
    out.push('<sheetData>');
    Object.keys(rows).map(Number).sort(function (a, b) { return a - b; }).forEach(function (r) {
      out.push('<row r="' + r + '">');
      rows[r].sort(function (a, b) { return a[1] - b[1]; }).forEach(function (c) {
        var ref = colName(c[1]) + r, v = c[2];
        if (typeof v === 'number') { if (isFinite(v)) { out.push('<c r="' + ref + '"><v>' + v + '</v></c>'); } }
        else if (v !== null && v !== undefined && String(v) !== '') { out.push('<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlText(v) + '</t></is></c>'); }
      });
      out.push('</row>');
    });
    out.push('</sheetData></worksheet>');
    return out.join('');
  }
  function workbookFiles(sheets) {
    var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
    var wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
    var files = [];
    sheets.forEach(function (sh, i) {
      var n = i + 1;
      ct += '<Override PartName="/xl/worksheets/sheet' + n + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
      wb += '<sheet name="' + xmlText(sh.name) + '" sheetId="' + n + '" r:id="rId' + n + '"/>';
      rels += '<Relationship Id="rId' + n + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + n + '.xml"/>';
      files.push({ name: 'xl/worksheets/sheet' + n + '.xml', text: sheetXml(sh) });
    });
    return [
      { name: '[Content_Types].xml', text: ct + '</Types>' },
      { name: '_rels/.rels', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', text: wb + '</sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', text: rels + '</Relationships>' }
    ].concat(files);
  }
  // ---- zip, with the browser's own deflate ----
  var CRC_TABLE = (function () { var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) { c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; } t[n] = c >>> 0; } return t; })();
  function crc32(b) { var c = 0xFFFFFFFF; for (var i = 0; i < b.length; i++) { c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); } return (c ^ 0xFFFFFFFF) >>> 0; }
  function deflate(bytes) { return new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer().then(function (b) { return new Uint8Array(b); }); }
  function zip(files) {
    var now = new Date(), time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    var date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate(), enc = new TextEncoder();
    return Promise.all(files.map(function (f) {
      var raw = enc.encode(f.text);
      return deflate(raw).then(function (c) { return { name: f.name, method: 8, time: time, date: date, crc: crc32(raw), csize: c.length, usize: raw.length, data: c }; });
    })).then(zipWrite);
  }
  function zipWrite(entries) {
    var parts = [], central = [], offset = 0, enc = new TextEncoder();
    entries.forEach(function (e) {
      var name = enc.encode(e.name), h = new DataView(new ArrayBuffer(30)), c = new DataView(new ArrayBuffer(46));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(8, e.method, true); h.setUint16(10, e.time, true); h.setUint16(12, e.date, true);
      h.setUint32(14, e.crc, true); h.setUint32(18, e.csize, true); h.setUint32(22, e.usize, true); h.setUint16(26, name.length, true);
      parts.push(new Uint8Array(h.buffer), name, e.data);
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(10, e.method, true); c.setUint16(12, e.time, true);
      c.setUint16(14, e.date, true); c.setUint32(16, e.crc, true); c.setUint32(20, e.csize, true); c.setUint32(24, e.usize, true);
      c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + e.data.length;
    });
    var cdSize = central.reduce(function (s, p) { return s + p.length; }, 0), end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  function excelName() {
    var safe = function (s) { return String(s).trim().replace(/[\\/:*?"<>|]/g, '_'); };
    return 'AUTOAMKB_' + safe(D.project) + '_' + safe(D.etape) + '_' + nowText().slice(0, 10) + '.xlsx';
  }
  // Export saves first, so the Excel file and the saved map always describe the same state
  document.getElementById('export').onclick = function () {
    var saved = false;
    status('');
    save().then(function () {
      saved = true;
      status('Skriver Excel …');
      return zip(workbookFiles(buildSheets())).then(function (blob) {
        if (!window.showSaveFilePicker) { download(blob, excelName()); status('Excel gemt som download: ' + excelName()); return; }
        var opts = { suggestedName: excelName(), types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }] };
        if (fileHandle) { opts.startIn = fileHandle; }
        return window.showSaveFilePicker(opts).then(function (h) {
          return h.createWritable().then(function (w) { return w.write(blob).then(function () { return w.close(); }); }).then(function () { status('Kortet er gemt, og Excel er skrevet: ' + h.name); });
        });
      });
    }).catch(function (e) {
      // The browser allows one file dialog per click; the first export may already have used it to find the map
      if (saved && e && (e.name === 'SecurityError' || e.name === 'NotAllowedError')) { status('Kortet er gemt. Klik "Eksportér Excel" igen for at vælge, hvor Excel-filen skal ligge.'); return; }
      failed(e, 'Eksport');
    });
  };

  // ---- the Montagehul window: bottom right, resized from its top-left corner (double-click the corner to reset).
  // The size is a per-browser convenience; the info and marks column keeps clear of it ----
  var bPanel = document.getElementById('bPanel'), rightCol = document.getElementById('right'), grip = document.getElementById('bGrip');
  var SIZE_KEY = 'amkb-kort-montagehul-vindue', resizing = null;
  try {
    var size = JSON.parse(localStorage.getItem(SIZE_KEY) || 'null');
    if (size) { bPanel.style.width = size.w + 'px'; bPanel.style.height = size.h + 'px'; }
  } catch (e) { /* no stored size: the default one */ }
  function fitRight() { rightCol.style.bottom = (bPanel.offsetHeight + 24) + 'px'; }
  grip.addEventListener('pointerdown', function (e) {
    e.preventDefault(); grip.setPointerCapture(e.pointerId);
    var r = bPanel.getBoundingClientRect();
    resizing = { x: e.clientX, y: e.clientY, w: r.width, h: r.height };
  });
  grip.addEventListener('pointermove', function (e) {
    if (!resizing) { return; }
    bPanel.style.width = Math.max(300, resizing.w + resizing.x - e.clientX) + 'px';
    bPanel.style.height = Math.max(120, resizing.h + resizing.y - e.clientY) + 'px';
  });
  grip.addEventListener('pointerup', function () {
    if (!resizing) { return; }
    resizing = null;
    var r = bPanel.getBoundingClientRect();
    try { localStorage.setItem(SIZE_KEY, JSON.stringify({ w: Math.round(r.width), h: Math.round(r.height) })); } catch (e) { /* not remembered */ }
  });
  grip.addEventListener('dblclick', function () {
    bPanel.style.width = ''; bPanel.style.height = '';
    try { localStorage.removeItem(SIZE_KEY); } catch (e) { /* nothing stored */ }
  });
  var sectionQueued = false;
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      fitRight();
      if (!sectionQueued) { sectionQueued = true; requestAnimationFrame(function () { sectionQueued = false; updateSection(); }); }
    }).observe(bPanel);
  }

  // ---- buttons, pan / zoom / click ----
  document.getElementById('kOn').onclick = function () { kindList.forEach(function (k) { k.on = true; }); buildKinds(); buildList(); draw(); };
  document.getElementById('kOff').onclick = function () { kindList.forEach(function (k) { k.on = false; }); buildKinds(); buildList(); draw(); };
  document.getElementById('lOn').onclick = function () { layers.concat([STATION_LAYER, PASSAGE_LAYER]).forEach(function (l) { l.on = true; }); buildLayers(); draw(); };
  document.getElementById('lOff').onclick = function () { layers.forEach(function (l) { l.on = false; }); buildLayers(); draw(); };
  document.getElementById('zin').onclick = function () { view.s *= 1.6; draw(); };
  document.getElementById('zout').onclick = function () { view.s /= 1.6; draw(); };
  document.getElementById('zall').onclick = function () { fitBox(allBox(), 0.05); draw(); };
  var down = null;
  canvas.addEventListener('pointerdown', function (e) { canvas.setPointerCapture(e.pointerId); down = { x: e.offsetX, y: e.offsetY, cx: view.cx, cy: view.cy, moved: false }; });
  canvas.addEventListener('pointermove', function (e) {
    if (!down) {
      if (meas.on) { meas.hover = [wx(e.offsetX), wy(e.offsetY)]; updateRead(); draw(); }
      else { canvas.style.cursor = pick(e.offsetX, e.offsetY) || pickLer(e.offsetX, e.offsetY) ? 'pointer' : ''; }
      return;
    }
    var dx = e.offsetX - down.x, dy = e.offsetY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { down.moved = true; canvas.classList.add('drag'); }
    if (down.moved) { view.cx = down.cx - dx / view.s; view.cy = down.cy + dy / view.s; draw(); }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (down && !down.moved) {
      if (meas.on) {
        if (meas.done) { meas.pts = []; meas.done = false; }
        meas.pts.push([wx(e.offsetX), wy(e.offsetY)]); updateRead(); draw();
      } else {
        // A finding first, then a LER line; either way the cross-section moves to where the click was
        var it = pick(e.offsetX, e.offsetY), lr = it ? null : pickLer(e.offsetX, e.offsetY);
        var spot = spotAt(e.offsetX, e.offsetY, it && it.alignment && PA[it.alignment] ? it.alignment : null);
        if (it) { select(it, false, spot); }
        else if (lr) { selectLer(lr); if (spot) { sel = spot; updateB(); draw(); } }
        else if (spot) { select(null); sel = spot; updateB(); draw(); }
        else { select(null); }
      }
    }
    down = null; canvas.classList.remove('drag');
  });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var f = Math.exp(-e.deltaY * 0.0015), mx = e.offsetX, my = e.offsetY, bx = wx(mx), by = wy(my);
    view.s = Math.min(400, Math.max(0.02, view.s * f));
    view.cx = bx - (mx - W / 2) / view.s; view.cy = by + (my - H / 2) / view.s; draw();
  }, { passive: false });
  window.addEventListener('resize', function () { resize(); draw(); });

  document.title = 'AUTOAMKB kort ' + D.project + ' ' + D.etape;
  document.getElementById('meta').textContent = D.project + ' · ' + D.etape + ' · ' + D.runTime;
  resize(); fitBox(allBox(), 0.05);
  redoNarrow(allAlignments()); allAlignments().forEach(buildBands); rebuildItems();
  buildKinds(); buildLayers(); buildList(); buildNon(); updateB(); showSaveState(); fitRight();
  askStandard(); askDraft();
  draw();
})();
</script>
